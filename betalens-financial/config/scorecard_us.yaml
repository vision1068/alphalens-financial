# BetaLens scorecard for US (S&P 500) companies. Same ten factors as PSX; valuation and dividend-yield
# scales are set for US norms in betalens/scoring/factors.py. Thresholds are calibrated by the US back-test.
period_years: 3
min_coverage: 60
# Interim thresholds 2026-11-17: set from the spread of US scores so about 10% are Strong Buy, 20% Buy,
# 40% Hold, 20% Sell, 10% Strong Sell. To be re-checked against the 10-year back-test.
signals:
  strong_buy: 74
  buy: 66
  hold: 54
  sell: 44
weights:
  revenue_growth: 12
  earnings_growth: 8
  profitability: 6
  cash_flow_quality: 12
  cash_conversion_cycle: 8
  debt: 12
  liquidity: 6
  valuation: 20
  dividend: 10
  price_trend: 6
financial_sectors: ["FINANCIALS"]
financial_excluded_factors: [cash_flow_quality, cash_conversion_cycle, debt, liquidity]
financial_extra_weights:
  price_to_book: 12
bank_sectors: []
bank_extra_weights: {}
