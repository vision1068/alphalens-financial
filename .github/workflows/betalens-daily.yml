name: BetaLens daily scores
on:
  schedule:
    - cron: '30 4 * * *'   # 09:30 Pakistan time (GMT+5) every day. Runs only from the default branch.
  workflow_dispatch:
  push:
    branches: [main, betalens-financial]
    paths:
      - 'betalens-financial/betalens/**'
      - 'betalens-financial/config/**'
      - 'betalens-financial/data/manual_statements.csv'
      - '.github/workflows/betalens-daily.yml'
permissions:
  contents: write
concurrency:
  group: betalens-daily
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: betalens-financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
      - run: python -m betalens.pipeline --backtest
        env:
          # AI notes and email alerts run only on the scheduled daily run, not on pushes or manual runs.
          BETALENS_DAILY_ANALYSIS: ${{ github.event_name == 'schedule' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PORTFOLIO_SYMBOLS: ${{ secrets.PORTFOLIO_SYMBOLS }}
      - name: Commit results
        run: |
          git config user.name "betalens-bot"
          git config user.email "betalens-bot@users.noreply.github.com"
          # Commit only this job's files onto the latest branch tip (the 30-minute live job commits live.json
          # separately). Retry if the other job pushed in between.
          for attempt in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --mixed FETCH_HEAD
            git add data/latest/scores.json data/latest/dividends.json data/latest/dividend_agent.json \
                    data/latest/analyst_notes.json data/backtest data/signal_log.csv data/alert_state.json
            git diff --cached --quiet && exit 0
            git commit -q -m "data: daily analysis"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
