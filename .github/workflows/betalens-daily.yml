name: BetaLens daily scores
on:
  schedule:
    - cron: '17 12 * * 1-5'   # 17:17 Pakistan time, after the PSX close. Runs only from the default branch.
  workflow_dispatch:
  push:
    branches: [betalens-financial]
    paths:
      - 'betalens-financial/betalens/**'
      - 'betalens-financial/config/**'
      - 'betalens-financial/data/manual_statements.csv'
      - '.github/workflows/betalens-daily.yml'
permissions:
  contents: write
concurrency:
  group: betalens-daily
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: betalens-financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
      - run: python -m betalens.pipeline --backtest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PORTFOLIO_SYMBOLS: ${{ secrets.PORTFOLIO_SYMBOLS }}
      - name: Commit results
        run: |
          git config user.name "betalens-bot"
          git config user.email "betalens-bot@users.noreply.github.com"
          # Move onto the latest branch tip without touching the freshly generated files, then commit
          # only the data. An earlier run may have pushed data since this run's checkout.
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --mixed FETCH_HEAD
          git add data/latest data/backtest data/signal_log.csv data/alert_state.json
          git commit -m "data: daily scores" || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
