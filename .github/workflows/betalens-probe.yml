name: BetaLens probe
on:
  push:
    branches: [betalens-financial]
    paths: ['betalens-financial/probe/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          cd betalens-financial/probe
          mkdir -p out
          i=0
          while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sS -L -m 60 -A "Mozilla/5.0 (X11; Linux x86_64) BetaLens/0.1" -o "out/$name" -w "%{http_code}" "$url" || echo ERR)
            echo "$name $code $(wc -c < "out/$name" 2>/dev/null)" | tee -a out/_status.txt
            sleep 2
          done < urls.txt
      - name: Commit results
        run: |
          git config user.name "betalens-bot"
          git config user.email "betalens-bot@users.noreply.github.com"
          git add betalens-financial/probe/out
          git commit -m "probe: fetched pages" || exit 0
          git push
