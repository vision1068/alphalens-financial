name: BetaLens probe
on:
  push:
    branches: [betalens-financial]
    paths: ['betalens-financial/probe/urls.txt', 'betalens-financial/probe/probe.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q psxdata
      - name: Fetch endpoints
        run: python betalens-financial/probe/probe.py
      - name: Commit results
        run: |
          git config user.name "betalens-bot"
          git config user.email "betalens-bot@users.noreply.github.com"
          git add betalens-financial/probe/out
          git commit -m "probe: fetched pages" || exit 0
          git push
