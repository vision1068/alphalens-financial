name: BetaLens US back-test
on:
  schedule:
    - cron: '13 3 * * 0'   # Sundays 03:13 UTC: refresh the 10-year US back-test
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betalens-us-backtest
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: betalens-financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: betalens-financial/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python -m betalens.us.pipeline --backtest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit live data
        run: |
          git config user.name "betalens-bot"
          git config user.email "betalens-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --mixed FETCH_HEAD
            git add data/backtest_us
            git diff --cached --quiet && exit 0
            git commit -q -m "data: US back-test"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
